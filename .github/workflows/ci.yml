name: CI

on:
  push:
    branches: [master, vaxildan]
  pull_request:
    branches: [master, vaxildan]

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn test
      - run: yarn build
      - run: yarn build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-wallet-extension
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: web-wallet-web
          path: dist-web/
          retention-days: 14
